services:
  app:
    build: .
    container_name: rpg_primos
    working_dir: /var/www
    volumes:
      - .:/var/www
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: base64:$(php artisan key:generate --show)
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]
